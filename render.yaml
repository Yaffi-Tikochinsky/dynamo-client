# Render Blueprint – creates the static site for the React client.
services:
  - type: web
    name: dynamo-client
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # React Router: every path is served by index.html, so refreshing a page doesn't give 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://challenges-backend.onrender.com/api
